<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ninja Reaction V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050509;color:#fff;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 5%,#40190d,transparent 55%)}.app{max-width:600px;margin:auto;padding:16px;position:relative}
header{text-align:center}.logo{font-size:52px;animation:f 2s infinite}h1{margin:2px;font-size:29px;letter-spacing:2px;text-shadow:0 0 18px #ff5a1f}.tag,.small,.status,.sub{color:#aaa;font-size:13px}.sound{margin:10px;border:1px solid #444;border-radius:20px;padding:8px 13px;background:#15151d;color:#fff}
.panel{background:linear-gradient(145deg,#17171f,#0b0b10);border:1px solid #30303a;border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 15px 45px #0009}h2{font-size:17px}.row{display:flex;gap:9px;margin:8px 0}.row>*{flex:1}input,button{font-size:15px;border-radius:12px;padding:13px;border:0}input{background:#08080d;color:#fff;border:1px solid #383842;outline:0}button{background:linear-gradient(#ff702f,#d83b10);color:#fff;font-weight:900;cursor:pointer}button.secondary{background:#282832}button.danger{background:#8d2020}button:disabled{opacity:.4}.hidden{display:none!important}
.room{text-align:center;font-size:26px;font-weight:1000;letter-spacing:6px;color:#ff8b5b;background:#08080d;border:1px dashed #70351f;border-radius:14px;padding:13px}.players{display:grid;grid-template-columns:1fr 1fr;gap:9px}.player{padding:12px;text-align:center;border:1px solid #292932;border-radius:15px;background:#0a0a10}.player.active{border-color:#ff6428;box-shadow:0 0 30px #ff5a1f44}.points{font-size:27px;font-weight:1000}.turn{text-align:center;font-size:19px;font-weight:1000;background:#32160d;border:1px solid #70351f;border-radius:14px;padding:13px}.arena{min-height:360px;border-radius:22px;border:1px solid #33333d;background:radial-gradient(circle,#28150e,#09090f 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;overflow:hidden;position:relative}.arena.go{border-color:#ff6428;box-shadow:inset 0 0 100px #ff4f1435}.arena.trap{border-color:#e21f2f;box-shadow:inset 0 0 100px #e21f2f40}.count{font-size:80px;font-weight:1000;text-shadow:0 0 25px #ff6428}.symbol{font-size:92px}.message{font-size:27px;font-weight:1000}.tap{width:80%;height:82px;margin-top:20px;font-size:27px;box-shadow:0 8px 30px #ff5a1f44}.log{font-size:13px;color:#aaa;max-height:130px;overflow:auto}.log div{padding:7px 0;border-bottom:1px solid #222}.winner{text-align:center;font-size:30px;font-weight:1000;padding:15px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0}.flashgo{animation:fg .3s}.flashhit{animation:fh .35s}.p{position:fixed;font-size:25px;z-index:6;pointer-events:none;animation:burst .8s forwards}@keyframes f{50%{transform:translateY(-5px)}}@keyframes fg{20%{opacity:.28;background:#ff681f}100%{opacity:0}}@keyframes fh{20%{opacity:.3;background:#e21f2f}100%{opacity:0}}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(300deg);opacity:0}}.slash{position:fixed;left:50%;top:48%;z-index:8;pointer-events:none;font-size:58px;font-weight:1000;transform:translate(-50%,-50%) rotate(-18deg);text-shadow:0 0 20px #fff;animation:slash .55s ease-out forwards}.comboPop{position:fixed;left:50%;top:35%;z-index:8;pointer-events:none;font-size:34px;font-weight:1000;color:#ffb06e;text-shadow:0 0 18px #ff5a1f;animation:combo .75s ease-out forwards}@keyframes slash{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-18deg)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8) rotate(18deg)}}@keyframes combo{0%{opacity:0;transform:translate(-50%,0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.25)}}@media(max-width:420px){.arena{min-height:330px}.tap{width:92%}}
</style></head><body><div id="flash"></div><main class="app">
<header><div class="logo">🥷</div><h1>NINJA REACTION</h1><div class="tag">ONLINE 1v1 • REACT OR GET HIT</div><button id="sound" class="sound">🔊 SOUND ON</button></header>
<section id="lobby" class="panel"><h2>⚔️ Create or Join Room</h2><div class="row"><input id="name" maxlength="12" placeholder="Your ninja name"><button id="create">Create Room</button></div><div class="row"><input id="roomInput" maxlength="6" placeholder="6-character code"><button id="join" class="secondary">Join Room</button></div><div id="lobbyStatus" class="status"></div><div class="small">Send the room code to your friend.</div></section>
<section id="game" class="hidden"><div class="panel"><div class="small" style="text-align:center">ROOM CODE</div><div id="roomCode" class="room">------</div><div class="players"><div id="p0" class="player"><div class="pname">Player 1</div><div id="s0" class="points">0</div><div id="l0">❤️❤️❤️</div></div><div id="p1" class="player"><div class="pname">Player 2</div><div id="s1" class="points">0</div><div id="l1">❤️❤️❤️</div></div></div></div>
<div class="panel"><div id="turn" class="turn">Waiting...</div><div id="hud" class="status">ROUND 0 / 12 • COMBO x0</div><div id="status" class="status">Waiting...</div><div id="arena" class="arena"><div id="count" class="count">🥷</div><div id="symbol" class="symbol">👀</div><div id="message" class="message">WAITING</div><div id="sub" class="sub">Both players must join.</div><button id="tap" class="tap" disabled>⚡ TAP!</button></div><div id="log" class="log"></div></div>
<div id="resultPanel" class="panel hidden"><div id="winner" class="winner"></div><button id="again" style="width:100%">⚔️ PLAY AGAIN</button></div><div class="row"><button id="leave" class="danger">Leave Room</button><button id="copy" class="secondary">Copy Code</button></div></section>
<div class="small" style="text-align:center">Ninja Reaction Online • Firebase</div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getDatabase,ref,set,get,update,onValue,onDisconnect,remove}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const C={apiKey:"AIzaSyCQDS9l4LYSCErpLStIQgj-0jGwyLByH3s",authDomain:"ninja-reaction.firebaseapp.com",databaseURL:"https://ninja-reaction-default-rtdb.firebaseio.com",projectId:"ninja-reaction",storageBucket:"ninja-reaction.firebasestorage.app",messagingSenderId:"613575954059",appId:"1:613575954059:web:87b4d7619fea250af38e8e"},db=getDatabase(initializeApp(C)),q=id=>document.getElementById(id);
let room="",me=-1,myName="",off=null,last=null,armed=false,start=0,lock=false,cv=0,sound=true,ac=null,mt=null,mi=0,trapTimer=null,combo=0;
const lobby=q("lobby"),game=q("game");
function stat(x){q("lobbyStatus").textContent=x}function gs(x){q("status").textContent=x}function clean(x){return(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)}function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}function pn(i,s){return s.players?.[i]?.name||"Player "+(i+1)}function lives(n){return"❤️".repeat(n||0)+"🖤".repeat(3-(n||0))}function log(x){let d=document.createElement("div");d.textContent=x;q("log").prepend(d)}
function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}function tone(f,d=.12,t="sine",v=.04,delay=0){if(!sound)return;audio();let o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.001,ac.currentTime+delay);g.gain.exponentialRampToValueAtTime(v,ac.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+delay+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+d+.02)}
function sfx(x){if(x==="count")tone(420,.1,"square");if(x==="go"){tone(650,.1,"sawtooth");tone(980,.18,"sine",.05,.08)}if(x==="hit"){tone(120,.2,"sawtooth",.07);tone(70,.25,"square",.05,.08)}if(x==="perfect")[700,1000,1400].forEach((f,i)=>tone(f,.18,"triangle",.05,i*.08));if(x==="win")[523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.05,i*.1))}
function music(){if(!sound||mt)return;audio();let a=[110,123,98,130,110,146,98,123];mt=setInterval(()=>tone(a[mi++%a.length],.18,"triangle",.035),420)}function stopMusic(){if(mt){clearInterval(mt);mt=null}}
q("sound").onclick=()=>{sound=!sound;q("sound").textContent=sound?"🔊 SOUND ON":"🔇 SOUND OFF";sound?music():stopMusic()}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    stopMusic();
  }else if(sound && room){
    music();
  }
});
window.addEventListener("pagehide",stopMusic);

function fx(hit=false){let f=q("flash");f.className=hit?"flashhit":"flashgo";setTimeout(()=>f.className="",400);let a=hit?["💥","💀","⚡"]:["⚡","✨","🔥","💨"];for(let i=0;i<12;i++){let p=document.createElement("div");p.className="p";p.textContent=a[i%a.length];p.style.left="50%";p.style.top="45%";p.style.setProperty("--x",(Math.random()*280-140)+"px");p.style.setProperty("--y",(Math.random()*260-130)+"px");document.body.append(p);setTimeout(()=>p.remove(),850)}}
function slashFx(comboValue){
  let s=document.createElement("div");s.className="slash";s.textContent="⚔️ SLASH!";document.body.append(s);setTimeout(()=>s.remove(),600);
  if(comboValue>1){let c=document.createElement("div");c.className="comboPop";c.textContent=`🔥 COMBO x${comboValue}`;document.body.append(c);setTimeout(()=>c.remove(),800)}
}
function updateHud(s){
  let round=Math.min(s.round||0,12);
  q("hud").textContent=`ROUND ${round} / 12 • COMBO x${combo}`;
}

function show(){lobby.classList.add("hidden");game.classList.remove("hidden");q("roomCode").textContent=room;music()}
function disconnect(){let r=ref(db,`rooms/${room}/players/${me}/connected`);set(r,true);onDisconnect(r).set(false)}
async function create(){combo=0;audio();myName=(q("name").value.trim()||"Ninja").slice(0,12);room=code();me=0;let x={status:"lobby",round:0,current:0,players:[{name:myName,connected:true,score:0,lives:3},{name:"Waiting...",connected:false,score:0,lives:3}],target:"idle",result:""};try{await set(ref(db,"rooms/"+room),x);sub();show()}catch(e){stat(e.message)}}
async function join(){combo=0;audio();room=clean(q("roomInput").value);myName=(q("name").value.trim()||"Ninja").slice(0,12);if(room.length!==6)return stat("Enter a 6-character code.");let s=await get(ref(db,"rooms/"+room));if(!s.exists())return stat("Room not found.");if(s.val().players?.[1]?.connected)return stat("Room is full.");me=1;await update(ref(db,`rooms/${room}/players/1`),{name:myName,connected:true,score:0,lives:3});sub();show()}
function sub(){if(off)off();off=onValue(ref(db,"rooms/"+room),s=>{if(!s.exists())return leaveLocal();last=s.val();render(last);disconnect()})}
function render(s){updateHud(s);for(let i=0;i<2;i++){q("p"+i).classList.toggle("active",s.current===i&&s.status==="playing");q("p"+i).querySelector(".pname").textContent=pn(i,s)+(s.players?.[i]?.connected?"":" • offline");q("s"+i).textContent=s.players?.[i]?.score||0;q("l"+i).textContent=lives(s.players?.[i]?.lives||0)}if(!s.players?.[1]?.connected){q("turn").textContent="🥷 WAITING FOR PLAYER 2";gs("Send the room code to your friend.");q("count").textContent="👀";q("symbol").textContent="🥷";q("message").textContent="WAITING";q("sub").textContent="Room: "+room;q("tap").disabled=true;return}
if(s.status==="lobby"){q("turn").textContent="⚔️ BOTH NINJAS READY";gs("Starting match...");q("count").textContent="3";q("message").textContent="MATCH STARTING";q("tap").disabled=true;if(me===0&&!lock){lock=true;begin()}}
else if(s.status==="countdown"){q("turn").textContent=`🥷 ${pn(s.current,s)} — YOUR TURN`;countdown(s)}
else if(s.status==="signal")signal(s)
else if(s.status==="roundResult"){q("tap").disabled=true;q("message").textContent=s.resultText;q("sub").textContent=s.reactionMs+" ms"}
else if(s.status==="finished")finish(s)}
function countdown(s){let v=++cv,n=s.count||3;q("arena").className="arena";q("count").textContent=n;q("symbol").textContent="👀";q("message").textContent=n===3?"GET READY":"FOCUS";q("sub").textContent="Don't tap yet!";sfx("count");let t=()=>{if(v!==cv)return;if(n>1){n--;q("count").textContent=n;sfx("count");setTimeout(t,600)}};setTimeout(t,600)}
function signal(s){
  if(trapTimer){clearTimeout(trapTimer);trapTimer=null}
  q("count").textContent="⚡";
  q("symbol").textContent=s.target==="trap"?"💀":"⚡";
  q("message").textContent=s.target==="trap"?"TRAP! DON'T TAP!":"TAP NOW!";
  q("sub").textContent=s.target==="trap"?"Fake signal — wait! Auto-continue in 1.5s":"React as fast as possible!";
  q("arena").className="arena "+(s.target==="trap"?"trap":"go");
  q("tap").disabled=me!==s.current||armed;
  if(me===s.current&&!armed){
    armed=true;start=performance.now();
    sfx(s.target==="trap"?"hit":"go");fx(s.target==="trap");
  }
  // A trap is a "don't tap" challenge, so it must resolve automatically.
  if(s.target==="trap"){
    trapTimer=setTimeout(async()=>{
      trapTimer=null;
      let fresh=(await get(ref(db,`rooms/${room}`))).val();
      if(!fresh||fresh.status!=="signal"||fresh.target!=="trap")return;
      armed=false;q("tap").disabled=true;
      const text=`🛡️ ${pn(fresh.current,fresh)} avoided the trap!`;
      await update(ref(db,`rooms/${room}`),{
        status:"roundResult",resultText:text,reactionMs:0
      });
      log(text);
      setTimeout(next,900);
    },1500);
  }
}
async function tap(){if(!last||me!==last.current||last.status!=="signal"||!armed)return;if(trapTimer){clearTimeout(trapTimer);trapTimer=null;}armed=false;q("tap").disabled=true;let rt=Math.round(performance.now()-start),trap=last.target==="trap",p=last.players[me],score=p.score||0,lv=p.lives||0,text;if(navigator.vibrate)navigator.vibrate(trap?[80,50,100]:25);if(trap){lv=Math.max(0,lv-1);combo=0;text=`💀 ${pn(me,last)} hit the trap! -1 life`;sfx("hit");fx(true)}else{combo++;let multiplier=combo>=5?2:combo>=3?1.5:1;let base=rt<180?5:rt<300?4:rt<500?3:2;let pts=Math.round(base*multiplier);score+=pts;text=`⚡ ${pn(me,last)} reacted in ${rt} ms (+${pts})`;if(rt<180){text="🔥 PERFECT! "+text;sfx("perfect")}else sfx("go");fx();slashFx(combo)}await update(ref(db,`rooms/${room}`),{[`players/${me}/score`]:score,[`players/${me}/lives`]:lv,status:"roundResult",resultText:text,reactionMs:rt});log(text);setTimeout(next,900)}
async function next(){let s=(await get(ref(db,"rooms/"+room))).val();if(!s||s.status!=="roundResult")return;if(s.players[0].lives<=0||s.players[1].lives<=0||s.round>=12)return update(ref(db,"rooms/"+room),{status:"finished",result:s.players[0].score===s.players[1].score?"draw":s.players[0].score>s.players[1].score?0:1});await update(ref(db,`rooms/${room}`),{status:"countdown",round:s.round+1,current:s.round%2,count:3,target:"idle"});setTimeout(async()=>{let z=(await get(ref(db,"rooms/"+room))).val();if(z?.status==="countdown")update(ref(db,`rooms/${room}`),{status:"signal",target:Math.random()<.22?"trap":"go"})},2400)}
async function begin(){let s=(await get(ref(db,"rooms/"+room))).val();if(s?.status!=="lobby")return;await update(ref(db,`rooms/${room}`),{status:"countdown",round:1,current:0,count:3,target:"idle"});setTimeout(async()=>{let z=(await get(ref(db,"rooms/"+room))).val();if(z?.status==="countdown"&&z.round===1)update(ref(db,`rooms/${room}`),{status:"signal",target:Math.random()<.22?"trap":"go"})},2400)}
function finish(s){let t=s.result==="draw"?"DRAW!":`${pn(s.result,s)} WINS!`;
q("hud").textContent=`FINAL SCORE • ${s.players[0].score} — ${s.players[1].score}`;q("turn").textContent="🏆 GAME OVER";q("count").textContent="🏆";q("symbol").textContent="🥷";q("message").textContent=t;q("sub").textContent=`${s.players[0].score} — ${s.players[1].score}`;q("winner").textContent=t;q("resultPanel").classList.remove("hidden");sfx("win");fx();stopMusic()}
async function again(){if(me!==0)return;combo=0;lock=false;await update(ref(db,`rooms/${room}`),{status:"countdown",round:1,current:0,count:3,target:"idle",result:"","players/0/score":0,"players/0/lives":3,"players/1/score":0,"players/1/lives":3});q("resultPanel").classList.add("hidden");music();setTimeout(async()=>{let s=(await get(ref(db,"rooms/"+room))).val();if(s?.status==="countdown")update(ref(db,`rooms/${room}`),{status:"signal",target:Math.random()<.22?"trap":"go"})},2400)}
async function leave(){try{await remove(ref(db,`rooms/${room}/players/${me}`))}catch{}leaveLocal()}function leaveLocal(){combo=0;if(off)off();off=null;stopMusic();cv++;room="";me=-1;game.classList.add("hidden");lobby.classList.remove("hidden");q("resultPanel").classList.add("hidden");stat("Left room.")}
q("create").onclick=create;q("join").onclick=join;q("tap").onclick=tap;q("again").onclick=again;q("leave").onclick=leave;q("copy").onclick=async()=>{q("roomInput").value=room;try{await navigator.clipboard.writeText(room)}catch{}stat("Room code copied!")}
</script></body></html>
